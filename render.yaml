databases:
  # Free Postgres instances expire after 30 days, and a plain web service's
  # local disk isn't persisted across deploys -- without a real database
  # here, Subscriber signups and score history get silently wiped on every
  # git push. Basic-256mb ($6/mo) is the cheapest instance type that doesn't
  # expire.
  - name: foodtracker-db
    plan: basic-256mb
    diskSizeGB: 1
    databaseName: foodtracker
    user: foodtracker

services:
  - type: web
    name: foodtracker
    env: python
    buildCommand: pip install -r requirements.txt && python seed.py
    startCommand: gunicorn wsgi:app --workers 1 --threads 4 --bind 0.0.0.0:$PORT
    envVars:
      - key: SCAN_INTERVAL_SECONDS
        value: "300"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: foodtracker-db
          property: connectionString
      # These three are already set manually in the Render dashboard (not
      # provisioned by this Blueprint) -- listed here with sync: false purely
      # so the full set of env vars this app needs is documented in one
      # place. Render ignores sync: false entries on an existing service, so
      # editing these values here has no effect; change them in the
      # dashboard instead. See README.md's "Email notifications" section.
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFY_EMAIL_TO
        sync: false
      # Flip this from the resend.dev sandbox default to an address on a
      # verified domain once one exists -- see README.md's "Turning off
      # sandbox mode."
      - key: NOTIFY_EMAIL_FROM
        sync: false
