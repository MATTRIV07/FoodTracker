{% extends "base.html" %}
{% block title %}Unsubscribe — FoodTracker{% endblock %}
{% block content %}
<div class="unsubscribe-confirm">
  <p>Unsubscribe <strong>{{ subscriber.email }}</strong> from FoodTracker reward notifications?</p>
  <form method="post" action="{{ url_for('main.unsubscribe', token=token) }}">
    <button type="submit">Confirm unsubscribe</button>
  </form>
  <p><a href="{{ url_for('main.index') }}">Never mind, take me back</a></p>
</div>
{% endblock %}
